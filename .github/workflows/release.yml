# The release of speclint (FTR.HMR.SPEC-0002 R1, tech §2.4): a tag v<version> of the contract gives binaries
# with checksums, the public image ghcr.io/greenongrey/speclint:<version> and keyless cosign signatures of
# both. The action and the template of GitLab take the image by the version of the tag.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions: { contents: read }

jobs:
  release:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest is moving to Ubuntu 26
    permissions: { contents: write, packages: write, id-token: write }
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/greenongrey/speclint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false  # no dependencies
      - name: The tag is the version of the contract
        id: version
        run: |
          want=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' contract/parse.go)
          [[ ${TAG#v} == "$want" ]] || { echo "::error::tag $TAG, contract.Version $want"; exit 1; }
          grep -q "SPECLINT_VERSION: \"$want\"" templates/speclint.gitlab-ci.yml || { echo "::error::templates/speclint.gitlab-ci.yml is not on $want"; exit 1; }
          echo "version=$want" >> "$GITHUB_OUTPUT"
      - run: go test ./...
      - name: Binaries and checksums
        run: |
          mkdir -p dist build
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""; [[ $os == windows ]] && ext=".exe"
              out="build/${os}_${arch}"
              mkdir -p "$out"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$out/speclint$ext" ./cmd/speclint
              cp LICENSE README.md "$out/"
              name="speclint_${TAG#v}_${os}_${arch}"
              if [[ $os == windows ]]; then (cd "$out" && zip -q "../../dist/$name.zip" ./*); else tar -C "$out" -czf "dist/$name.tar.gz" .; fi
            done
          done
          (cd dist && sha256sum ./* | sed 's# \./# #' > checksums.txt)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image and the checksums (cosign, keyless, GitHub OIDC)
        env: { DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}", DIGEST: "${{ steps.push.outputs.digest }}" }
        run: |
          cat > notes.md <<NOTES
          Image: \`$IMAGE:${TAG#v}\` (\`$DIGEST\`)

          Verify:

          \`\`\`sh
          cosign verify $IMAGE:${TAG#v} \\
            --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
            --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/$TAG \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          \`\`\`
          NOTES
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
