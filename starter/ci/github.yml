# Managed by Hammurapi (FTR.HMR.SPEC-0002): only the version line is updated.
# The check of [[if eq .Mode "service"]]the tests of service [[.Service]] against its features in Hammurapi[[else]]the specifications against the document contract of Hammurapi[[end]].
name: speclint
on:
  pull_request:
  push:
    branches: ["[[.Branch]]"]
permissions: { contents: read[[if eq .Mode "service"]], id-token: write[[end]] }

jobs:
  speclint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: GreenOnGrey/speclint@v[[.Version]]
        with:
          mode: [[.Mode]]
[[- if eq .Mode "service"]]
          hammurapi-url: "[[.Hammurapi]]"
          service: "[[.Service]]"
[[- end]]
